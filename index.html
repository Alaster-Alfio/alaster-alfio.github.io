<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explosion Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #808080;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #explosionButton {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ff0000;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            z-index: 10;
        }

        #explosionButton:hover {
            transform: scale(1.1);
        }

        #explosionButton:active {
            transform: scale(0.95);
        }

        #explosionButton.hidden {
            display: none;
        }

        #explosionVideo {
            position: absolute;
            width: 500px;
            height: 500px;
            display: none;
            z-index: 20;
        }

        #explosionVideo.playing {
            display: block;
        }

        #revealedText {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-align: center;
            display: none;
            z-index: 5;
            animation: fadeIn 0.5s ease-in-out;
        }

        #revealedText.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="explosionButton">Click Me!</button>
        <video id="explosionVideo" autoplay>
            <source src="explosion.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div id="revealedText">Will you be my Valentines?</div>
    </div>

    <script>
        const button = document.getElementById('explosionButton');
        const video = document.getElementById('explosionVideo');
        const revealedText = document.getElementById('revealedText');

        button.addEventListener('click', function() {
            // Hide the button
            button.classList.add('hidden');
            
            // Play the video
            video.classList.add('playing');
            video.play();

            // Show the text when the video ends
            video.addEventListener('ended', function() {
                video.classList.remove('playing');
                revealedText.classList.add('show');
            }, { once: true });
        });
    </script>
</body>
</html>
